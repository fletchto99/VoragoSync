name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-publish
  cancel-in-progress: false
  queue: max

jobs:
  checks:
    uses: ./.github/workflows/tests.yml

  build:
    needs: checks
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: write
      id-token: write
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require a commit from main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate release version and build non-dev ZIP
        run: npm run build:release -- "$RELEASE_TAG"
      - name: Test the exact packaged runtime
        env:
          RELEASE_ARCHIVE: dist/voragosync-${{ github.ref_name }}.zip
        run: npm run test:release
      - name: Attest the tested ZIP and checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/voragosync-${{ github.ref_name }}.zip
            dist/SHA256SUMS
      - name: Upload the exact tested release assets
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: |
            dist/voragosync-${{ github.ref_name }}.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: write
      attestations: read
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download the exact tested release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: dist
          digest-mismatch: error
      - name: Verify tag, provenance, and checksums before publishing
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          tag_commit="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)"
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::Release tag no longer points to the tested commit."
            exit 1
          fi
          merge_base="$(gh api "repos/$GH_REPO/compare/$GITHUB_SHA...main" \
            --jq .merge_base_commit.sha)"
          if [[ "$merge_base" != "$GITHUB_SHA" ]]; then
            echo "::error::The tested release commit is no longer on main."
            exit 1
          fi
          for asset in "voragosync-$RELEASE_TAG.zip" SHA256SUMS; do
            gh attestation verify "$asset" \
              --repo "$GH_REPO" \
              --cert-identity "$GITHUB_SERVER_URL/$GH_REPO/.github/workflows/release.yml@$GITHUB_REF" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --signer-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners \
              --predicate-type https://slsa.dev/provenance/v1
          done
          sha256sum --strict --check SHA256SUMS
      - name: Publish release
        working-directory: dist
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            "voragosync-$RELEASE_TAG.zip" SHA256SUMS \
            --verify-tag --generate-notes --title "$RELEASE_TAG"
